
# ============================================================================
# System Configuration
# ============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ============================================================================
# Power Management (Optional)
# ============================================================================
# CONFIG_PM_DEVICE=y

# ============================================================================
# UART Configuration
# ============================================================================
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y

# ============================================================================
# Networking Stack
# ============================================================================
CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=12000

# Network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# NB-IoT has large latency, so increase timeouts. It is ok to use this for Cat-M1 as well.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=15000
CONFIG_NET_CONNECTION_MANAGER=y
# Network buffers
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_BT_BUF_ACL_TX_SIZE=100
CONFIG_BT_BUF_ACL_RX_SIZE=100
CONFIG_BT_L2CAP_TX_MTU=100

# ============================================================================
# Modem Driver - SimCOM
# ============================================================================
CONFIG_MODEM=y
#SimCOM modem
CONFIG_MODEM_SIM7000=y
# Statistics
CONFIG_MODEM_MODULES=y
CONFIG_NET_L2_PPP=y
CONFIG_MODEM_PPP=y
CONFIG_MODEM_STATS=y

CONFIG_MODEM_SIMCOM_SIM7000_BAUDRATE=115200

# ============================================================================
# Shell and Debug Tools
# ============================================================================
CONFIG_SHELL=y
CONFIG_MODEM_SHELL=y

# ============================================================================
# GNSS Support
# ============================================================================
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=y
# ===========================================================================


# ============================================================================
# Logging
# ============================================================================
CONFIG_LOG=y
#CONFIG_MODEM_LOG_LEVEL_DBG=y
CONFIG_NET_LOG=y

CONFIG_MODEM_SIMCOM_SIM7000_RAT_M1=y
CONFIG_MODEM_SIMCOM_SIM7000_LTE_BANDS="4,8,20,28"
CONFIG_MODEM_SIMCOM_SIM7000_APN="hologram"
CONFIG_MODEM_SIM7000_RSSI_PERIODIC_POLLING=n

# ============================================================================
# COAP
# ============================================================================
CONFIG_COAP=y



# ============================================================================
# GPIO
# ============================================================================
CONFIG_GPIO=y


# ============================================================================
# BLE
# ============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tracker"
CONFIG_BT_DEVICE_APPEARANCE=833

# L2CAPCOC Dependencies
# CONFIG_BT_SMP=y
# CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y


# ============================================================================
# BLE manager
# ============================================================================
CONFIG_BLE_MGR=y